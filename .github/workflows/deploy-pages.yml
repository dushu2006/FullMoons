name: Deploy website to GitHub Pages

# Publishes a fully static copy of the site at
# https://dushu2006.github.io/FullMoons/ so it can be shared with anyone.
# Normal Node hosting (next start) is unaffected.

on:
  push:
    branches: ["main", "arena/a1737341-fullmoons"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # GitHub Pages has no Node server, so the database health endpoint
      # has nothing to run on — exclude it from the static export only.
      - name: Exclude server-only API from static export
        run: rm -rf src/app/api

      - name: Build static export
        run: npm run build
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_SITE_URL: https://dushu2006.github.io/FullMoons

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - id: deployment
        uses: actions/deploy-pages@v4
